[project]
name = "verifier-bottleneck-iclr"
version = "0.1.0"
description = "Artem's supervised follow-up experiments for the Verifier Bottleneck"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.6.0",
  "transformers==4.57.1",
  "peft==0.19.1",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
torch = {index = "pytorch-cu124"}
