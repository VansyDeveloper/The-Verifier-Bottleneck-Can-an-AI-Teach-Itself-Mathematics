name: polynomial_programs_v1
train_primes: [5, 7, 13, 19, 23, 29]
heldout_primes: [11, 17]
degree_caps: [2, 3, 4]
operations: [SH1, SC2, REV, AC1, AX1]
max_depth: 4
require_order_sensitive: true
ban_adjacent:
  - [REV, REV]
splits:
  sft_train:
    modes: [apply, plan]
    depths: [1]
    size: 20000
  sft_validation:
    modes: [apply, plan]
    depths: [1]
    size: 1000
  dev_exploration:
    modes: [plan]
    depths: [2, 3]
    size: 300
  test_apply_indomain:
    modes: [apply]
    depths: [2, 3, 4]
    size_per_depth: 500
  test_apply_heldout:
    modes: [apply]
    depths: [2, 3, 4]
    size_per_depth: 500
  test_plan_final:
    modes: [plan]
    depths: [2, 3, 4]
    size: 1000
    min_depth3_heldout: 300
  base_support_subset:
    modes: [plan]
    depths: [3]
    size: 100
    samples_per_task: 1024
