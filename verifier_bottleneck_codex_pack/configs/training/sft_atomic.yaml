name: sft_atomic_r16
base_config: configs/base.yaml
model_config: configs/model/qwen3_0_6b_base.yaml
lora_config: configs/training/lora_r16.yaml
data_config: configs/data/polynomial_programs.yaml
train_split: sft_train
validation_split: sft_validation
learning_rate: 0.0002
num_train_epochs: 1
max_epochs: 3
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler_type: cosine
