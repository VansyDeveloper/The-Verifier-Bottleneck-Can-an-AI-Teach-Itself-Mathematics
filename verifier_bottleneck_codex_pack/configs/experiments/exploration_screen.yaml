name: exploration_screen
model_config: configs/model/qwen3_0_6b_base.yaml
adapter: artifacts/adapters/sft_atomic_r16
data_split: dev_exploration
candidates_per_task: 32
max_new_tokens: 64
methods:
  - name: low_t
    type: iid
    temperature: 0.2
    top_p: 1.0
  - name: iid_t07
    type: iid
    temperature: 0.7
    top_p: 1.0
  - name: high_t
    type: iid
    temperature: 1.2
    top_p: 0.95
  - name: temp_mix
    type: temperature_mixture
    temperatures: [0.2, 0.6, 1.0, 1.4]
    count_each: 8
  - name: prefix_balanced
    type: forced_first_operation
    temperature: 0.7
    top_p: 1.0
    counts:
      SH1: 6
      SC2: 6
      REV: 6
      AC1: 6
      AX1: 6
      unrestricted: 2
metrics:
  - parse_rate
  - candidate_correct_rate
  - pass_at_k
  - unique_programs
  - unique_correct_programs
  - shortest_solution_recall
  - all_solution_coverage
  - signature_entropy
  - actual_tokens
  - elapsed_seconds
